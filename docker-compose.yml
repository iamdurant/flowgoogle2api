services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: flowgoogle2api:latest
    restart: unless-stopped
    shm_size: "512mb"        # Chrome keeps its IPC buffers here
    environment:
      AUTH_KEY: ${AUTH_KEY:-change-me}
      FLOW_PROXY: ${FLOW_PROXY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PORT: "3000"
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
      WORKERS_PER_ACCOUNT: ${WORKERS_PER_ACCOUNT:-2}
      IMAGE_TTL_MS: ${IMAGE_TTL_MS:-3600000}
      GENERATE_TIMEOUT_MS: ${GENERATE_TIMEOUT_MS:-120000}
    volumes:
      - ./data:/app/data     # accounts.json + generated images
    ports:
      - "${HOST_PORT:-3000}:3000"
